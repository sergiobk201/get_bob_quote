name: BOB USDT Quote Automation

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs: 
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run history bob  
        run: python append_bob_quote.py

      - name: Commit and push csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bob_usdt_history.csv
          git commit -m "Quote: $(date +'%Y-%m-%d')" || exit 0
          git push


